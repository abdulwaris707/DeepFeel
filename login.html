<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — DEEPFEEL</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <header class="site-header" style="border-bottom: 1px solid var(--border-light);">
    <div class="container header-container" style="grid-template-columns: 1fr auto;">
      <a href="index.html" class="brand-logo">DEEP<span>FEEL</span></a>
      <a href="shop.html" class="link-editorial">&larr; Back to Shop</a>
    </div>
  </header>

  <main class="section" style="padding-top: 5rem; min-height: 75vh; display: flex; align-items: center;">
    <div class="container" style="max-width: 440px;">
      
      <div style="background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-xs); padding: 3rem 2.2rem;">
        <div class="text-center" style="margin-bottom: 2rem;">
          <span class="editorial-tagline">PATRON PORTAL</span>
          <h1 style="font-family: var(--font-display); font-size: 2rem; margin-bottom: 0.5rem;">Welcome Back</h1>
          <p style="font-size: 0.88rem; color: var(--text-secondary);">Access your private scent vault and order chronicles.</p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-input" placeholder="elena@example.com" value="elena@example.com" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" value="patron123" required />
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 1rem;">
            SIGN IN &rarr;
          </button>
        </form>

        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-light); text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
          New to Maison DeepFeel? <a href="register.html" style="color: var(--accent-gold); font-weight: 600; text-decoration: underline;">Create an account</a>
        </div>
      </div>

    </div>
  </main>

  <footer class="site-footer" style="padding: 2rem 0; text-align: center;">
    <div class="container">
      <p style="font-size: 0.82rem; color: var(--text-light-muted);">&copy; 2026 DEEPFEEL. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("login-form")?.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const pass = document.getElementById("login-password").value;
      const res = Auth.login(email, pass);
      if (res.success) {
        UI.showToast("Welcome back, " + res.user.name, "success");
        setTimeout(() => {
          window.location.href = res.user.role === "admin" ? "admin/index.html" : "account.html";
        }, 800);
      } else {
        UI.showToast(res.message || "Invalid credentials", "error");
      }
    });
  </script>
</body>
</html>
