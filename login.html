<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — DeepFeel</title>
  <meta name="description" content="Sign in to your DeepFeel customer account to track orders and manage delivery addresses." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- Navigation Header -->
  <header class="site-header">
    <div class="container header-container">
      <a href="index.html" class="brand-logo">DEEP<span>FEEL</span></a>
      <a href="index.html" class="btn btn-ghost btn-sm">&larr; Return to Store</a>
    </div>
  </header>

  <main class="section">
    <div class="container-narrow" style="max-width: 480px;">
      
      <div style="background-color: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 2.5rem; box-shadow: var(--shadow-sm);">
        <div class="text-center" style="margin-bottom: 2rem;">
          <span class="section-subtitle">Client Portal</span>
          <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Sign In to DeepFeel</h1>
          <p style="font-size: 0.92rem;">Access your order history and saved addresses.</p>
        </div>

        <!-- Demo Quick-Fill Buttons -->
        <div style="background-color: var(--bg-surface-subtle); border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 0.9rem; margin-bottom: 1.5rem; text-align: center;">
          <span style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 0.5rem;">Demo Quick Sign-In</span>
          <div style="display: flex; gap: 0.5rem; justify-content: center;">
            <button type="button" class="btn btn-outline btn-sm" id="fill-demo-customer-btn">Customer Demo</button>
            <button type="button" class="btn btn-outline btn-sm" id="fill-demo-admin-btn">Admin Demo</button>
          </div>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="elena.vance@example.com" required />
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
              <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
              <a href="#" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: underline;">Forgot password?</a>
            </div>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required />
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-full" style="margin-top: 1.2rem;">Sign In &rarr;</button>
        </form>

        <div class="text-center" style="margin-top: 1.8rem; font-size: 0.9rem; border-top: 1px solid var(--border-light); padding-top: 1.2rem;">
          Don't have an account yet? <a href="register.html" style="font-weight: 600; color: var(--accent-primary); text-decoration: underline;">Create an Account</a>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container text-center" style="padding: 2rem 0;">
      <p>&copy; 2026 DeepFeel Living Co. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
