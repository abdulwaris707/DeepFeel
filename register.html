<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — DeepFeel</title>
  <meta name="description" content="Register for a DeepFeel account to enjoy streamlined checkout, order tracking, and exclusive collection previews." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- Navigation Header -->
  <header class="site-header">
    <div class="container header-container">
      <a href="index.html" class="brand-logo">DEEP<span>FEEL</span></a>
      <a href="index.html" class="btn btn-ghost btn-sm">&larr; Return to Store</a>
    </div>
  </header>

  <main class="section">
    <div class="container-narrow" style="max-width: 480px;">
      
      <div style="background-color: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 2.5rem; box-shadow: var(--shadow-sm);">
        <div class="text-center" style="margin-bottom: 2rem;">
          <span class="section-subtitle">Join DeepFeel</span>
          <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Create Account</h1>
          <p style="font-size: 0.92rem;">Enjoy faster checkout, saved wishlists, and order history.</p>
        </div>

        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="name">Full Name *</label>
            <input type="text" id="name" class="form-input" placeholder="e.g. Julian Thorne" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email Address *</label>
            <input type="email" id="email" class="form-input" placeholder="julian@example.com" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">Phone Number (Optional)</label>
            <input type="tel" id="phone" class="form-input" placeholder="+1 (555) 000-0000" />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Create Password *</label>
            <input type="password" id="password" class="form-input" placeholder="At least 6 characters" minlength="6" required />
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-full" style="margin-top: 1.2rem;">Create Account &rarr;</button>
        </form>

        <div class="text-center" style="margin-top: 1.8rem; font-size: 0.9rem; border-top: 1px solid var(--border-light); padding-top: 1.2rem;">
          Already have an account? <a href="login.html" style="font-weight: 600; color: var(--accent-primary); text-decoration: underline;">Sign In here</a>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container text-center" style="padding: 2rem 0;">
      <p>&copy; 2026 DeepFeel Living Co. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
