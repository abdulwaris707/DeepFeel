<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — DEEPFEEL</title>
  <meta name="description" content="Securely complete your luxury fragrance acquisition with encrypted checkout and concierge priority dispatch." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- Minimal Header -->
  <header class="site-header" style="border-bottom: 1px solid var(--border-light);">
    <div class="container header-container" style="grid-template-columns: 1fr auto;">
      <a href="index.html" class="brand-logo">DEEP<span>FEEL</span></a>
      <a href="cart.html" class="link-editorial">&larr; Return to Bag</a>
    </div>
  </header>

  <main class="section" style="padding-top: 3.5rem;">
    <div class="container">
      
      <div class="checkout-layout">
        
        <!-- Left: Form Steps -->
        <div>
          <form id="checkout-form">
            
            <!-- Contact -->
            <div style="background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-xs); padding: 2.2rem; margin-bottom: 2rem;">
              <span class="editorial-tagline">STEP 01</span>
              <h2 style="font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 1.2rem;">Patron Details</h2>

              <div class="form-grid-2">
                <div class="form-group">
                  <label class="form-label" for="first-name">First Name *</label>
                  <input type="text" id="first-name" class="form-input" placeholder="Elena" required />
                </div>
                <div class="form-group">
                  <label class="form-label" for="last-name">Last Name *</label>
                  <input type="text" id="last-name" class="form-input" placeholder="Vance" required />
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="email">Email Address (for priority tracking) *</label>
                <input type="email" id="email" class="form-input" placeholder="elena.vance@example.com" required />
              </div>
            </div>

            <!-- Shipping Destination -->
            <div style="background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-xs); padding: 2.2rem; margin-bottom: 2rem;">
              <span class="editorial-tagline">STEP 02</span>
              <h2 style="font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 1.2rem;">Delivery Residence</h2>

              <div class="form-group">
                <label class="form-label" for="address">Street Address *</label>
                <input type="text" id="address" class="form-input" placeholder="742 Evergreen Terrace" required />
              </div>

              <div class="form-grid-2">
                <div class="form-group">
                  <label class="form-label" for="city">City *</label>
                  <input type="text" id="city" class="form-input" placeholder="Portland" required />
                </div>
                <div class="form-group">
                  <label class="form-label" for="zip">ZIP / Postal Code *</label>
                  <input type="text" id="zip" class="form-input" placeholder="97201" required />
                </div>
              </div>
            </div>

            <!-- Payment -->
            <div style="background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-xs); padding: 2.2rem; margin-bottom: 2.5rem;">
              <span class="editorial-tagline">STEP 03</span>
              <h2 style="font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 1.2rem;">Encrypted Payment</h2>

              <div class="form-group">
                <label class="form-label" for="card-num">Card Number</label>
                <input type="text" id="card-num" class="form-input" placeholder="4242 •••• •••• 4242" value="4242 •••• •••• 4242" />
              </div>

              <div class="form-grid-2">
                <div class="form-group">
                  <label class="form-label">Expiry</label>
                  <input type="text" class="form-input" placeholder="MM/YY" value="12/28" />
                </div>
                <div class="form-group">
                  <label class="form-label">CVC</label>
                  <input type="text" class="form-input" placeholder="CVC" value="888" />
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-lg" style="height: 56px;">
              AUTHORIZE & COMPLETE ORDER &rarr;
            </button>
          </form>
        </div>

        <!-- Right: Summary -->
        <div>
          <div style="background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-xs); padding: 2.2rem; position: sticky; top: 110px;">
            <h3 style="font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 1.5rem;">Flacons in Order</h3>
            
            <div id="checkout-items-summary" style="margin-bottom: 1.5rem;">
              <!-- Inserted by app.js -->
            </div>

            <div style="border-top: 1px solid var(--border-light); padding-top: 1.2rem;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 0.6rem; font-size: 0.95rem;">
                <span>Subtotal</span>
                <strong id="chk-subtotal">$0.00</strong>
              </div>
              <div style="display: flex; justify-content: space-between; margin-bottom: 0.6rem; font-size: 0.95rem;">
                <span>Shipping</span>
                <span id="chk-shipping">FREE</span>
              </div>
              <div style="border-top: 1px solid var(--border-light); margin-top: 1rem; padding-top: 1rem; display: flex; justify-content: space-between; align-items: baseline;">
                <span style="font-weight: 600;">Total</span>
                <strong id="chk-total" style="font-size: 1.6rem; color: var(--text-primary);">$0.00</strong>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer" style="padding: 2rem 0; text-align: center;">
    <div class="container">
      <p style="font-size: 0.82rem; color: var(--text-light-muted);">&copy; 2026 DEEPFEEL. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
