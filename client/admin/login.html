<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Gateway — DeepFeel Command</title>
  <meta name="description" content="Secure administrative authentication for store managers." />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body" style="background-color: var(--admin-sidebar-bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;">

  <div style="background-color: var(--admin-surface); width: 100%; max-width: 420px; border-radius: var(--admin-radius-lg); padding: 2rem 1.75rem; box-shadow: var(--admin-shadow-lg); border: 1px solid var(--admin-border);">
    
    <div class="text-center" style="margin-bottom: 2rem;">
      <a href="../index.html" class="brand-logo" style="margin-bottom: 0.5rem;">DEEP<span>FEEL</span></a>
      <div style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent-primary); font-weight: 700; margin-bottom: 0.8rem;">
        Administration Suite
      </div>
      <p style="font-size: 0.9rem; color: var(--text-secondary);">Sign in to manage catalog, orders, and inventory.</p>
    </div>

    <form id="admin-login-form">
      <div class="form-group">
        <label class="form-label" for="admin-email">Admin Email</label>
        <input type="email" id="admin-email" class="form-input" placeholder="admin@domain.com" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label class="form-label" for="admin-password">Password</label>
        <input type="password" id="admin-password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
      </div>


      <button type="submit" class="btn btn-primary btn-lg btn-full" style="margin-top: 1.5rem;">
        Authorize & Enter Suite &rarr;
      </button>
    </form>

    <div class="text-center" style="margin-top: 1.5rem;">
      <a href="../index.html" style="font-size: 0.85rem; color: var(--text-muted); text-decoration: underline;">&larr; Return to Customer Storefront</a>
    </div>

  </div>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
