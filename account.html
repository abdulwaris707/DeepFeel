<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Account — DeepFeel</title>
  <meta name="description" content="Manage your DeepFeel customer account profile, delivery addresses, and preferences." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- Navigation Header -->
  <header class="site-header">
    <div class="container header-container">
      <button type="button" class="mobile-menu-toggle" aria-label="Toggle navigation menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <a href="index.html" class="brand-logo">DEEP<span>FEEL</span></a>

      <nav class="desktop-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link">Shop</a>
        <a href="categories.html" class="nav-link">Categories</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>

      <div class="header-utilities">
        <button type="button" class="header-icon-btn nav-search-trigger" aria-label="Search catalog">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>

        <a href="wishlist.html" class="header-icon-btn" aria-label="Wishlist">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
          <span class="badge-count wishlist-count-badge" style="display: none;">0</span>
        </a>

        <a href="cart.html" class="header-icon-btn" aria-label="Shopping Bag">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="badge-count cart-count-badge" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      
      <div class="section-header">
        <span class="section-subtitle">Client Portal</span>
        <h1 class="section-title">My Account</h1>
      </div>

      <div class="account-layout">
        
        <!-- Left Navigation -->
        <aside class="account-nav">
          <a href="account.html" class="account-nav-link active">Profile & Address</a>
          <a href="orders.html" class="account-nav-link">Order History</a>
          <a href="wishlist.html" class="account-nav-link">Wishlist</a>
          <button type="button" id="account-logout-btn" class="account-nav-link" style="width: 100%; text-align: left; color: var(--color-error); border: none; background: none; cursor: pointer;">
            Sign Out
          </button>
        </aside>

        <!-- Right Content: Profile Form -->
        <div style="background-color: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 2.5rem;">
          
          <div style="display: flex; align-items: center; gap: 1.2rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border-light); padding-bottom: 1.5rem;">
            <div style="width: 56px; height: 56px; border-radius: var(--radius-pill); background-color: var(--accent-subtle); color: var(--accent-primary); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 700;">
              👤
            </div>
            <div>
              <h2 id="account-user-name" style="font-size: 1.4rem;">Customer</h2>
              <span id="account-user-email" class="text-muted" style="font-size: 0.9rem;">customer@example.com</span>
              <span style="display: block; font-size: 0.8rem; color: var(--text-muted);">Member since <span id="account-joined-date">August 2026</span></span>
            </div>
          </div>

          <h3 style="font-size: 1.15rem; margin-bottom: 1.5rem;">Profile & Shipping Information</h3>

          <form id="account-profile-form">
            <div class="form-grid-2">
              <div class="form-group">
                <label class="form-label" for="profile-name">Full Name</label>
                <input type="text" id="profile-name" class="form-input" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="profile-phone">Phone Number</label>
                <input type="tel" id="profile-phone" class="form-input" />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="profile-street">Saved Street Address</label>
              <input type="text" id="profile-street" class="form-input" />
            </div>

            <div class="form-grid-3">
              <div class="form-group">
                <label class="form-label" for="profile-city">City</label>
                <input type="text" id="profile-city" class="form-input" />
              </div>
              <div class="form-group">
                <label class="form-label" for="profile-state">State / Province</label>
                <input type="text" id="profile-state" class="form-input" />
              </div>
              <div class="form-group">
                <label class="form-label" for="profile-zip">Postal / ZIP Code</label>
                <input type="text" id="profile-zip" class="form-input" />
              </div>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 1.5rem;">Save Changes</button>
          </form>

        </div>

      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container text-center" style="padding: 2rem 0;">
      <p>&copy; 2026 DeepFeel Living Co. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
