<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Gateway — DeepFeel Command</title>
  <meta name="description" content="Secure administrative authentication for store managers." />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body style="background-color: var(--bg-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">

  <div style="background-color: var(--bg-surface); width: 100%; max-width: 440px; border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-xl); border: 1px solid var(--border-light);">
    
    <div class="text-center" style="margin-bottom: 2rem;">
      <a href="../index.html" class="brand-logo" style="margin-bottom: 0.5rem;">DEEP<span>FEEL</span></a>
      <div style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent-primary); font-weight: 700; margin-bottom: 0.8rem;">
        Administration Suite
      </div>
      <p style="font-size: 0.9rem; color: var(--text-secondary);">Sign in to manage catalog, orders, and inventory.</p>
    </div>

    <!-- Demo Credentials Notice -->
    <div style="background-color: var(--accent-subtle); border: 1px solid var(--accent-border); border-radius: var(--radius-sm); padding: 0.9rem; margin-bottom: 1.5rem; font-size: 0.82rem;">
      <div style="font-weight: 600; color: var(--text-primary); margin-bottom: 0.2rem;">Demo Admin Credentials:</div>
      <div style="color: var(--text-secondary);">Email: <code>admin@deepfeel.pk</code></div>
      <div style="color: var(--text-secondary); margin-bottom: 0.5rem;">Password: <code>admin123</code></div>
      <button type="button" class="btn btn-outline btn-sm btn-full" id="admin-fill-demo-btn">
        Fill Admin Credentials
      </button>
    </div>

    <form id="admin-login-form">
      <div class="form-group">
        <label class="form-label" for="admin-email">Admin Email</label>
        <input type="email" id="admin-email" class="form-input" placeholder="admin@deepfeel.pk" required />
      </div>


      <div class="form-group">
        <label class="form-label" for="admin-password">Password</label>
        <input type="password" id="admin-password" class="form-input" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-full" style="margin-top: 1.5rem;">
        Authorize & Enter Suite &rarr;
      </button>
    </form>

    <div class="text-center" style="margin-top: 1.5rem;">
      <a href="../index.html" style="font-size: 0.85rem; color: var(--text-muted); text-decoration: underline;">&larr; Return to Customer Storefront</a>
    </div>

  </div>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
